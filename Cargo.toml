[package]
name = "speakeasy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.8", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.191"
openmls = "0.9.2"
openmls_basic_credential = { version = "0.6.0", features = ["clonable"] }
openmls_rust_crypto = "0.6.0"
# Not called directly: its `ring` feature gives the TLS client a crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
