# A relay with TLS on one host.
#
#   SPEAKEASY_DOMAIN=relay.example.org docker compose -f deploy/compose.yaml up -d --build
#
# The domain must already point at this host, with ports 80 and 443 open.
# The relay keeps everything in memory and is not reachable except through
# Caddy. The only thing stored on disk is Caddy's TLS certificate.
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: none

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPEAKEASY_DOMAIN: ${SPEAKEASY_DOMAIN:?set SPEAKEASY_DOMAIN to the relay's host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
