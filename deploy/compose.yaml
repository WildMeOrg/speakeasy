# A relay with TLS on one host.
#
#   echo "SPEAKEASY_DOMAIN=relay.example.org" > deploy/.env
#   docker compose -f deploy/compose.yaml up -d --build
#
# Every compose command needs the domain, which is why it goes in a file.
#
# The domain must already point at this host, with ports 80 and 443 open.
# The relay keeps everything in memory and is not reachable except through
# Caddy. Neither container's output is kept, because Caddy's error log can
# name client addresses. Caddy stores its TLS keys and certificate on disk.
# Turn off swap on the host (`swapoff -a`), or memory can reach disk that way.
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: none

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: none
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPEAKEASY_DOMAIN: ${SPEAKEASY_DOMAIN:?set SPEAKEASY_DOMAIN to the relay's host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
